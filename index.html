<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>FinAxis — Mini App</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    :root {
      --bg: #0b0f17;
      --card: #131a26;
      --accent: #14b8a6;
      --text: #f1f5f9;
      --muted: #94a3b8;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background: var(--bg); color: var(--text); padding: 16px; }
    .card { background: var(--card); border: 1px solid rgba(255,255,255,0.08); border-radius: 16px; padding: 16px; margin-bottom: 14px; }
    .title { font-size: 18px; font-weight: 700; margin-bottom: 6px; }
    .sub { font-size: 13px; color: var(--muted); margin-bottom: 12px; }
    .kpi { font-size: 24px; font-weight: 700; color: var(--accent); }
    canvas { max-height: 220px; width: 100% !important; }
  </style>
</head>
<body>
  <div class="card">
    <div class="title" id="greeting">FinAxis Аналитика</div>
    <div class="sub">Прогноз пассивного дохода (после 13% НДФЛ)</div>
    <div class="kpi">13 180,50 ₽ / год</div>
    <div class="sub">~1 098,38 ₽ в месяц</div>
  </div>

  <div class="card">
    <div class="title">Выплаты по месяцам</div>
    <canvas id="divChart"></canvas>
  </div>

  <script>
    const tg = window.Telegram && window.Telegram.WebApp;
    if (tg) {
      tg.ready();
      tg.expand();
      const user = tg.initDataUnsafe && tg.initDataUnsafe.user;
      if (user && user.first_name) {
        document.getElementById("greeting").textContent = "FinAxis — " + user.first_name;
      }
    }

    const ctx = document.getElementById("divChart").getContext("2d");
    new Chart(ctx, {
      type: "bar",
      data: {
        labels: ["Янв", "Фев", "Мар", "Апр", "Май", "Июн", "Июл", "Авг", "Сен", "Окт", "Ноя", "Дек"],
        datasets: [{
          label: "Выплаты, ₽",
          data: [0, 0, 0, 0, 2741, 1305, 8439, 0, 0, 0, 0, 696],
          backgroundColor: "#14b8a6",
          borderRadius: 6
        }]
      },
      options: {
        responsive: true,
        plugins: { legend: { display: false } },
        scales: {
          x: { ticks: { color: "#94a3b8" }, grid: { display: false } },
          y: { ticks: { color: "#94a3b8" }, grid: { color: "rgba(255,255,255,0.06)" } }
        }
      }
    });
  </script>
</body>
</html>
